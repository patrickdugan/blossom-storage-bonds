[package]
name = "bsb-regtest"
version = "0.1.0"
edition = "2021"
publish = false
description = "Blossom storage bonds: the sentinel bond chain as real transactions on Bitcoin Core regtest (harness and per-deal bond tool)"

[dependencies]
bitcoin = { version = "=0.32.7", features = ["rand-std"] }
musig2 = { version = "=0.4.1", default-features = false, features = ["k256"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }
serde_json = "1"
base64 = "0.22"

[[bin]]
name = "bsb-regtest"
path = "src/main.rs"

[[bin]]
name = "bsb-bond"
path = "src/bin/bond.rs"

[[bin]]
name = "bsb-formal-evidence"
path = "src/bin/formal_vectors.rs"
