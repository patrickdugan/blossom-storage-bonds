[package]
name = "bsb-r0"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bsb-r0"
path = "src/main.rs"

[dependencies]
bsb-methods = { path = "../methods" }
risc0-zkvm = { workspace = true, features = ["bonsai", "client", "prove"] }
risc0-groth16 = { workspace = true }
risc0-circuit-recursion = "2.0.0"
risc0-to-bitvm2-core = { workspace = true }
anyhow = "1.0"
bitcoin = "0.32.5"
blake3 = "1.5.0"
borsh = { version = "1.5.3", features = ["derive"] }
hex = "0.4.3"
num-bigint = "0.4.5"
serde_json = "1.0.108"
sha2 = "0.10.8"
