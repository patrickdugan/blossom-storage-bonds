[package]
name = "bsb-bitvm-check"
version = "0.1.0"
edition = "2021"

# BitVM at 7d1ca36 ("DO NOT USE IN PRODUCTION"); Cargo.lock started as a copy of BitVM's.
[dependencies]
blake3 = "=1.8.2"
musig2 = { version = "=0.4.1", default-features = false, features = ["k256"] }
bitcoin-script-stack = { git = "https://github.com/BitVM/rust-bitcoin-script-stack" }
bitcoin-script = { git = "https://github.com/BitVM/rust-bitcoin-script" }
bitvm = { git = "https://github.com/BitVM/BitVM", rev = "7d1ca36" }
ark-bn254 = { version = "0.5.0", features = ["curve", "scalar_field"], default-features = false }
ark-ff = "0.5.0"
ark-groth16 = "0.5.0"
bitcoin = "0.32.5"
serde_json = "1.0.116"

# BitVM's own dev profile, so its bridge tests can reuse these artifacts (shared CARGO_TARGET_DIR).
[profile.dev]
opt-level = 3
