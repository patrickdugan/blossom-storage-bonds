name: FROST sponsor sabotage and missing package adversarial regtest

# Regtest-only three signed histories. A real sponsor consumes previously
# locked fee inputs after signer process ends, then withdraws the wallet.
# This CI MUST preserve evidence of liveness failure, never declare that
# an active two-share quorum is prevented from stealing.
on:
  push:
    branches:
      - research/frost-sponsor-sabotage-2026-10-24
    paths:
      - "experiments/storage-bond-ab/b-layertree/owner-paths/adversarial/**"
      - "experiments/storage-bond-ab/b-layertree/owner-paths/relay_owner_branch.mjs"
      - ".github/workflows/frost-sponsor-sabotage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-sponsor-attacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check signed Rust code and all pure Bitcoin relay scripts
        run: |
          set -euo pipefail
          cargo test --locked \
            --manifest-path experiments/storage-bond-ab/b-layertree/frost-proof/Cargo.toml
          node --check experiments/storage-bond-ab/b-layertree/owner-paths/adversarial/spend_sponsor.mjs
          node --check experiments/storage-bond-ab/b-layertree/owner-paths/adversarial/probe_sponsor.mjs
          node --check experiments/storage-bond-ab/b-layertree/owner-paths/relay_owner_branch.mjs
          bash -n experiments/storage-bond-ab/b-layertree/owner-paths/adversarial/run_sabotage_regtest.sh

      - name: Fetch verified Bitcoin Core 30.3
        env:
          BITCOIN_CORE_SHA256: 4753cd70416c629a2090503e8545a3c05e94a0f5037f8fb97b4c35c6e1afee0e
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core"
          cd "$RUNNER_TEMP/core"
          curl --proto '=https' --tlsv1.2 -fsSLo bitcoin.tar.gz \
            https://bitcoincore.org/bin/bitcoin-core-30.3/bitcoin-30.3-x86_64-linux-gnu.tar.gz
          echo "$BITCOIN_CORE_SHA256  bitcoin.tar.gz" | sha256sum -c -
          tar -xzf bitcoin.tar.gz
          test -x bitcoin-30.3/bin/bitcoind
          test -x bitcoin-30.3/bin/bitcoin-cli

      - name: Execute actual sponsor attacks after FROST signer exits
        env:
          BITCOIND_EXEC: ${{ runner.temp }}/core/bitcoin-30.3/bin/bitcoind
          BITCOIN_CLI_EXEC: ${{ runner.temp }}/core/bitcoin-30.3/bin/bitcoin-cli
          BSB_SPONSOR_ATTACK_RECEIPT_DIR: ${{ runner.temp }}/sponsor-adversarial-receipts
        run: |
          set -euo pipefail
          bash experiments/storage-bond-ab/b-layertree/owner-paths/adversarial/run_sabotage_regtest.sh

      - name: Publish only sanitized results with no FROST signing secrets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FROST-real-sponsor-fee-griefing-three-regtest-trials
          path: |
            ${{ runner.temp }}/sponsor-adversarial-receipts/alice-first.json
            ${{ runner.temp }}/sponsor-adversarial-receipts/both-first.json
            ${{ runner.temp }}/sponsor-adversarial-receipts/bob-second.json
          retention-days: 7
          if-no-files-found: error
