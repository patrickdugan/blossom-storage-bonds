name: Binohash admission model

on:
  push:
    branches: [research/binohash-admission]
    paths:
      - "model/*.mjs"
      - "research/consensus-check/**"
      - ".github/workflows/binohash-admission.yml"
  pull_request:
    paths:
      - "model/*.mjs"
      - "research/consensus-check/**"
      - ".github/workflows/binohash-admission.yml"

permissions:
  contents: read

jobs:
  model-tests:
    name: Node 22 research regressions only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: No mining, GPU proof generation, or pilot execution
        run: node --test model/*.test.mjs

  offline-consensus:
    name: Offline Core 26 legacy Script verifier (no bitcoind)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Create unfunded deterministic Script vectors
        run: node model/binohash_consensus_vectors.mjs > /tmp/binohash-vectors.json
      - name: Cross-check against vendored Bitcoin Core libbitcoinconsensus
        run: cargo run --release --manifest-path research/consensus-check/Cargo.toml < /tmp/binohash-vectors.json
      - name: Generate unfunded two-generation cursor vectors
        run: node model/binohash_linked_cursor_vectors.mjs > /tmp/binohash-linked-cursor-vectors.json
      - name: Cross-check honest and hostile cursor successors against Bitcoin Core
        run: cargo run --release --manifest-path research/consensus-check/Cargo.toml < /tmp/binohash-linked-cursor-vectors.json
