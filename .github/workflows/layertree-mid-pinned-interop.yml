name: Pinned Sapio LayerTree MID oracle conformance

# Executes the actual EXPERIMENTAL MID WASM guest and oracle-wrapper
# authorization tests from an exact, reviewed Sapio PR1 commit.
# The oracle still decides/authorizes spends; Bitcoin itself does NOT
# execute experimental OP_TX, CSFS or LayerTree MID transaction rules.
on:
  push:
    branches:
      - research/layertree-storage-bond-overlay-2026-10-23
    paths:
      - "experiments/storage-bond-ab/b-layertree/mid/**"
      - ".github/workflows/layertree-mid-pinned-interop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mid-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/sapio
          ref: 34363851a11d0f2b3ddb27c050537c1a2e5b7e9b
          path: pinned-sapio-mid
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check signed-guest source pin and raw fixture amounts
        run: |
          set -euo pipefail
          test "$(git -C pinned-sapio-mid rev-parse HEAD)" = \
            34363851a11d0f2b3ddb27c050537c1a2e5b7e9b
          test -s pinned-sapio-mid/evaluators/artifacts/bitcoin_script_mid.wasm
          grep -F 'let alice = example::member(210, 60_000);' \
            pinned-sapio-mid/integration_tests/tests/layertree.rs
          grep -F 'let bob = example::member(211, 40_000);' \
            pinned-sapio-mid/integration_tests/tests/layertree.rs
          sha256sum pinned-sapio-mid/evaluators/artifacts/bitcoin_script_mid.wasm
          cd pinned-sapio-mid
          rustup show
          rustc --version

      - name: Real MID guest - owner-authorized 60k and 40k sequential exits
        working-directory: pinned-sapio-mid
        run: |
          cargo test --locked -p sapio_integration_tests --test layertree \
            two_members_exit_sequentially_without_either_coparticipants_signature -- --exact --nocapture

      - name: Real MID guest - historical signed voucher resurrection negative finding
        working-directory: pinned-sapio-mid
        run: |
          cargo test --locked -p sapio_integration_tests --test layertree \
            historical_owner_nonce_reuse_revives_a_signed_voucher_in_the_real_mid_guest -- --exact --nocapture

      - name: Real MID guest - crash-persisted dual holder signing reservations
        working-directory: pinned-sapio-mid
        run: |
          cargo test --locked -p sapio_integration_tests --test layertree \
            synced_signing_reservation_survives_restart_and_binds_both_exits -- --exact --nocapture

      - name: Real MID guest - reject altered beneficiary payout despite fresh owner signature
        working-directory: pinned-sapio-mid
        run: |
          cargo test --locked -p sapio_integration_tests --test layertree \
            fresh_owner_signatures_cannot_change_state_principal_or_exact_payout -- --exact --nocapture

      - name: Execute actual pinned MID guest and export Alice/Bob signed exit transactions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mid-proof"
          test -f experiments/storage-bond-ab/b-layertree/mid/sapio_mid_exit_vectors.rs
          cp experiments/storage-bond-ab/b-layertree/mid/sapio_mid_exit_vectors.rs \
             pinned-sapio-mid/integration_tests/examples/bsb_mid_exit_vectors.rs
          (
            cd pinned-sapio-mid
            cargo run --locked -p sapio_integration_tests --example bsb_mid_exit_vectors \
              > "$RUNNER_TEMP/mid-proof/signed-mid-exits.json"
          )
          node experiments/storage-bond-ab/b-layertree/mid/verify_mid_vectors.mjs \
            "$RUNNER_TEMP/mid-proof/signed-mid-exits.json" \
            "$RUNNER_TEMP/mid-proof/verified-mid-exits.json"

      - name: Emit explicitly non-consensus MID oracle attestation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mid-proof"
          node experiments/storage-bond-ab/b-layertree/mid/check_expected.mjs \
            "$RUNNER_TEMP/mid-proof/mid-guest-oracle-scope.json"
          node - "$RUNNER_TEMP/mid-proof/mid-guest-oracle-scope.json" <<'JS'
          const fs=require("node:fs");
          const r=JSON.parse(fs.readFileSync(process.argv[2]));
          if(r.sapioRevision!=="34363851a11d0f2b3ddb27c050537c1a2e5b7e9b" ||
             r.totalInitialPrincipalSats!==100000 ||
             r.actualCompiledMidEmulationGuestExercised!==true ||
             r.userExitWithoutOtherOwnersSignatureInModel!==true ||
             r.onlineSapioOracleStillRequired!==true ||
             r.historicalVoucherReplayAttackReproduced!==true ||
             r.bitcoinConsensusEnforcesExperimentalMid!==false ||
             r.realFrostThresholdIntegratedWithMid!==false ||
             r.testsPassed.length!==4)
             throw Error("pinned MID test evidence overstates Bitcoin consensus");
          console.log("Pinned Sapio MID guest: four suite filters and signed 60/40 oracle vectors passed; oracle trust remains.");
          JS

      - name: Install SHA256-verified Bitcoin Core 30.3 for genuine FROST control
        env:
          CORE_SHA256: 4753cd70416c629a2090503e8545a3c05e94a0f5037f8fb97b4c35c6e1afee0e
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core"
          cd "$RUNNER_TEMP/core"
          curl --proto '=https' --tlsv1.2 -fsSLo bitcoin.tar.gz \
            https://bitcoincore.org/bin/bitcoin-core-30.3/bitcoin-30.3-x86_64-linux-gnu.tar.gz
          echo "$CORE_SHA256  bitcoin.tar.gz" | sha256sum -c -
          tar -xzf bitcoin.tar.gz
          test -x bitcoin-30.3/bin/bitcoin-cli
          test -x bitcoin-30.3/bin/bitcoind

      - name: Execute independently funded FROST P2TR carrier on Bitcoin Core
        env:
          BITCOIND_EXEC: ${{ runner.temp }}/core/bitcoin-30.3/bin/bitcoind
          BITCOIN_CLI_EXEC: ${{ runner.temp }}/core/bitcoin-30.3/bin/bitcoin-cli
          BSB_B_FROST_RECEIPT_DIR: ${{ runner.temp }}/mid-proof/frost
        run: |
          set -euo pipefail
          bash experiments/storage-bond-ab/b-layertree/frost-proof/run_p2tr_regtest.sh
          test -s "$RUNNER_TEMP/mid-proof/frost/real-frost-p2tr-regtest.json"

      - name: Differential proof - online MID oracle versus Bitcoin-only FROST keypath
        run: |
          set -euo pipefail
          node experiments/storage-bond-ab/b-layertree/mid/compare_mid_frost.mjs \
            --mid "$RUNNER_TEMP/mid-proof/verified-mid-exits.json" \
            --oracle "$RUNNER_TEMP/mid-proof/mid-guest-oracle-scope.json" \
            --frost "$RUNNER_TEMP/mid-proof/frost/real-frost-p2tr-regtest.json" \
            > "$RUNNER_TEMP/mid-proof/differential-authorities.json"
          node - "$RUNNER_TEMP/mid-proof/differential-authorities.json" <<'JS'
          const fs=require("node:fs");
          const v=JSON.parse(fs.readFileSync(process.argv[2]));
          if(v.schema!=="bsb-ab-mid-frost-authorization-differential-v1" ||
             v.initialCollateralMatched!==true ||
             v.samePhysicalBitcoinCarrier!==false ||
             v.adversarial.realFrostQuorumCanSignAlternativeCommitmentWithSamePayouts!==true ||
             v.proofStatus.realSapioMidCompiledOracleGuestExecuted!==true ||
             v.proofStatus.realP2trBitcoinBip341Confirmed!==true ||
             v.proofStatus.bitcoinConsensusEnforcesMid!==false ||
             v.proofStatus.offlineHolderRecoveryWithoutOracleOrFederation!==false) {
             throw Error("MID/FROST comparison falsely equates the two signing authorities");
          }
          console.log("Genuine MID oracle and Bitcoin FROST differ: unauthorized keypath commitment accepted.");
          JS

      - name: Preserve public guest test scope without signing keys
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-sapio-mid-vs-frost-two-independent-authorities
          path: ${{ runner.temp }}/mid-proof/
          if-no-files-found: error
          retention-days: 7
