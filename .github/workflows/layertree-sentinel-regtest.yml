name: Funded A sentinel Taproot reference regtest

# Runs the existing Rust Taproot chain, not the abstract A/B model.
# Historical A stake is 1 BTC, while B surrogate is 100k sats.
on:
  push:
    branches:
      - research/layertree-storage-bond-overlay-2026-10-23
    paths:
      - experiments/storage-bond-ab/a-sentinel/regtest/**
      - .github/workflows/layertree-sentinel-regtest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-a-real-regtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-taproot-sentinels:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm Cargo and compile prerequisites
        run: |
          rustc --version
          cargo --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config clang

      - name: Checksum-verify Bitcoin Core 30.3 for funded Taproot run
        env:
          EXPECTED_SHA256: 4753cd70416c629a2090503e8545a3c05e94a0f5037f8fb97b4c35c6e1afee0e
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core"
          cd "$RUNNER_TEMP/core"
          curl --proto '=https' --tlsv1.2 -fsSLo bitcoin.tar.gz \
            https://bitcoincore.org/bin/bitcoin-core-30.3/bitcoin-30.3-x86_64-linux-gnu.tar.gz
          echo "$EXPECTED_SHA256  bitcoin.tar.gz" | sha256sum -c -
          tar -xzf bitcoin.tar.gz
          test -x bitcoin-30.3/bin/bitcoind
          test -x bitcoin-30.3/bin/bitcoin-cli

      - name: Execute funded presigned Taproot sentinel regression in isolated node
        env:
          BITCOIND_EXEC: ${{ runner.temp }}/core/bitcoin-30.3/bin/bitcoind
          BITCOIN_CLI_EXEC: ${{ runner.temp }}/core/bitcoin-30.3/bin/bitcoin-cli
          BSB_A_AB_RECEIPT_DIR: ${{ runner.temp }}/a-sentinel
        run: |
          set -euo pipefail
          bash -n experiments/storage-bond-ab/a-sentinel/regtest/run_original.sh
          bash experiments/storage-bond-ab/a-sentinel/regtest/run_original.sh

      - name: Preserve public Bitcoin Script pass/fail and size observations
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: funded-bitcoin-taproot-sentinel-original-1btc
          path: ${{ runner.temp }}/a-sentinel/original-sentinel-regtest.json
          if-no-files-found: error
          retention-days: 7
