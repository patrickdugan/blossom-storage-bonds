name: Blossom Lean protocol invariants

on:
  push:
    branches: [research/binohash-admission]
    paths:
      - "formal/**"
      - "regtest/src/**"
      - "regtest/Cargo.toml"
      - "regtest/Cargo.lock"
      - "model/verify_formal_evidence.mjs"
      - "research/consensus-check/**"
      - "lean-toolchain"
      - ".github/workflows/blossom-formal.yml"
  pull_request:
    paths:
      - "formal/**"
      - "regtest/src/**"
      - "regtest/Cargo.toml"
      - "regtest/Cargo.lock"
      - "model/verify_formal_evidence.mjs"
      - "research/consensus-check/**"
      - "lean-toolchain"
      - ".github/workflows/blossom-formal.yml"

permissions:
  contents: read

jobs:
  lean:
    name: Lean4 kernel check for storage-payment state machine
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone Lean 4 with elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.15.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proof file (no sorry)
        run: |
          ! grep -En '(^|[[:space:]])(sorry|admit)([[:space:]]|$)' formal/*.lean
          lean -o formal/Blossom.olean formal/Blossom.lean
          LEAN_PATH=formal lean -o formal/UTXORefinement.olean formal/UTXORefinement.lean
          LEAN_PATH=formal lean -o formal/MerkleBinding.olean formal/MerkleBinding.lean
          LEAN_PATH=formal lean -o formal/BitcoinInclusion.olean formal/BitcoinInclusion.lean
          LEAN_PATH=formal lean formal/BitcoinWitnessBinding.lean
          LEAN_PATH=formal lean formal/PaymentChannel.lean
          LEAN_PATH=formal lean formal/PresignedParents.lean
          LEAN_PATH=formal lean formal/RecipientAuthority.lean
          LEAN_PATH=formal lean formal/ContextualFinality.lean

  taproot-templates:
    name: Offline rust-bitcoin Taproot template refinement bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate signed and tampered BIP341 templates without bitcoind
        run: cargo run --locked --release --manifest-path regtest/Cargo.toml --bin bsb-formal-evidence > /tmp/bsb-taproot-evidence.json
      - name: Independently decode real Rust transaction serialization and output constraints
        run: node --experimental-strip-types model/verify_formal_evidence.mjs /tmp/bsb-taproot-evidence.json
      - name: Verify real Taproot P2TR witnesses and adversarial mutations in Bitcoin Core 26 Script
        run: cargo run --release --manifest-path research/consensus-check/Cargo.toml --bin taproot-evidence < /tmp/bsb-taproot-evidence.json
