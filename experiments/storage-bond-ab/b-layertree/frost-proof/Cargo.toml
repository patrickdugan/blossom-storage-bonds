[package]
name = "bsb-frost-bip340-proof"
version = "0.1.0"
edition = "2021"
publish = false
description = "Isolated 2-of-3 genuine FROST Taproot Schnorr signing proof; NOT Bitcoin transaction integration"

[dependencies]
frost-secp256k1-tr = "=3.0.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
secp256k1 = { version = "=0.29.1", features = ["std"] }
sha2 = "=0.10.9"
serde_json = "1.0"
